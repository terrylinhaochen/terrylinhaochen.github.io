<link rel="stylesheet" href="/reading-app/_astro/speed-read.J77zR24x.css"></head> <body class="min-h-screen flex flex-col bg-paper text-ink">  <main class="flex-1 w-full">  <div class="reader" data-speed-reader-app data-astro-cid-lslpcu4j> <header class="reader-header" data-astro-cid-lslpcu4j> <a class="reader-exit" href="/reading/" data-reader-exit aria-label="Back to book" data-astro-cid-lslpcu4j> <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true" data-astro-cid-lslpcu4j><path d="m14 6-6 6 6 6" data-astro-cid-lslpcu4j></path></svg> <span data-astro-cid-lslpcu4j>Back</span> </a> <span class="reader-book" data-reader-book data-astro-cid-lslpcu4j>Focused reading</span> <details class="chapters" data-reader-chapters data-astro-cid-lslpcu4j> <summary aria-label="Choose chapter" data-astro-cid-lslpcu4j> <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true" data-astro-cid-lslpcu4j><path d="M8 6h13M8 12h13M8 18h13M3 6h1M3 12h1M3 18h1" data-astro-cid-lslpcu4j></path></svg> <span data-reader-chapter-count data-astro-cid-lslpcu4j>Chapters</span> </summary> <div class="chapter-menu" data-astro-cid-lslpcu4j> <p class="chapter-caption" data-astro-cid-lslpcu4j>Digest sections</p> <div data-reader-chapter-list data-astro-cid-lslpcu4j></div> </div> </details> </header> <section class="reading-area" aria-label="Reading content" data-astro-cid-lslpcu4j> <h1 data-reader-title data-astro-cid-lslpcu4j>Choose a book to start reading</h1> <div class="word-stage" data-reader-stage aria-label="Word by word reader" data-astro-cid-lslpcu4j> <span class="word-ghost word-before" data-reader-prev aria-hidden="true" data-astro-cid-lslpcu4j></span> <span class="word-focus" data-reader-current data-astro-cid-lslpcu4j>Ready</span> <span class="word-ghost word-after" data-reader-next aria-hidden="true" data-astro-cid-lslpcu4j></span> </div> <article class="chapter-text" data-reader-text hidden aria-label="Full section text" data-astro-cid-lslpcu4j></article> <p class="reader-status" data-reader-status role="status" data-astro-cid-lslpcu4j></p> </section> <footer class="reader-controls" data-astro-cid-lslpcu4j> <div class="playback" data-astro-cid-lslpcu4j> <button type="button" class="step-button" data-reader-backward aria-label="Backward" title="Backward (←)" disabled data-astro-cid-lslpcu4j> <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true" data-astro-cid-lslpcu4j><path d="m19 5-9 7 9 7V5ZM5 5v14" data-astro-cid-lslpcu4j></path></svg> </button> <button type="button" class="play-button" data-reader-play disabled data-astro-cid-lslpcu4j>Play</button> <button type="button" class="step-button" data-reader-forward aria-label="Forward" title="Forward (→)" disabled data-astro-cid-lslpcu4j> <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true" data-astro-cid-lslpcu4j><path d="m5 5 9 7-9 7V5Zm14 0v14" data-astro-cid-lslpcu4j></path></svg> </button> <label class="speed-control" data-astro-cid-lslpcu4j><span class="sr-only" data-astro-cid-lslpcu4j>Reading speed</span><select data-reader-wpm aria-label="Reading speed" data-astro-cid-lslpcu4j><option value="200" data-astro-cid-lslpcu4j>200 wpm</option><option value="300" selected data-astro-cid-lslpcu4j>300 wpm</option><option value="450" data-astro-cid-lslpcu4j>450 wpm</option><option value="600" data-astro-cid-lslpcu4j>600 wpm</option><option value="750" data-astro-cid-lslpcu4j>750 wpm</option></select></label> </div> <div class="reader-bottom" data-astro-cid-lslpcu4j><span data-reader-progress-label data-astro-cid-lslpcu4j>0%</span><button type="button" data-reader-reset aria-label="Restart section" data-astro-cid-lslpcu4j>Restart</button><button type="button" data-reader-text-toggle data-astro-cid-lslpcu4j>Read text</button></div> <div class="reader-progress" role="progressbar" aria-label="Section progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" data-astro-cid-lslpcu4j><span data-reader-progress data-astro-cid-lslpcu4j></span></div> </footer> <noscript><p class="reader-status" data-astro-cid-lslpcu4j>Enable JavaScript for focused reading, or <a href="/books/the-mom-test/" data-astro-cid-lslpcu4j>read the book digest</a>.</p></noscript> </div> <script id="speed-reader-data" type="application/json">{"bookBasePath":"/reading/","answers":[],"books":[{"id":"the-mom-test","title":"The Mom Test","sections":[{"title":"Introduction","text":"The central problem in customer research is not that people lie. It is that most questions make honesty almost impossible. Ask someone whether your idea is good and they have to predict a future they cannot see while managing a social interaction they do not want to damage. Their answer may be sincere and still tell you nothing about demand. The Mom Test replaces that unreliable prediction with evidence from the person's life. Do not ask whether the idea could work. Reconstruct what already happened: the last time the problem appeared, the workaround they chose, the cost they accepted, and the people they involved. Then look for a commitment that moves the conversation forward. The book's deepest insight is that a customer conversation becomes useful only when it is capable of proving you wrong."},{"title":"Your idea contaminates the interview","text":"The instant you describe a product, the conversation changes. The other person stops being a witness to their own behavior and becomes a critic of your proposal. They infer what you hope to hear. They try to be encouraging, clever, or helpful. Even blunt criticism is shaped by the features and language you supplied. This is why a friendly conversation can generate pages of notes without reducing uncertainty. “I would use that” is a prediction about an imagined product in an imagined future. “That sounds useful” is often politeness. A feature request describes what someone can picture during the meeting, not necessarily what they value enough to adopt. Fitzpatrick's corrective is to keep the conversation on the customer's side of the table. Ask about their existing workflow before revealing yours. Find out when the problem last occurred, how they responded, which tools they used, where time or money disappeared, and who cared about the outcome. Specific questions are not merely better wording. They change the kind of evidence being collected."},{"title":"Evidence gets stronger as it becomes more costly","text":"The book implicitly describes an evidence ladder. Each step requires the customer to give up more than an opinion. An opinion is cheap. It can reveal vocabulary, taste, or emotional reaction, but it is weak evidence of demand. Past behavior is stronger because it describes a choice made under real constraints. A commitment is stronger still because the person gives something scarce: time for another meeting, an introduction to a colleague, access to an artifact, budget for a trial, or reputation spent advocating internally. The ladder does not mean every interview must end in a sale. The appropriate commitment depends on what is still unknown. Early in discovery, permission to inspect an existing spreadsheet may be more informative than a vague promise to buy. Later, a pilot that never reaches the actual workflow owner is weaker than it appears. The test is whether the next step creates new evidence and requires genuine participation."},{"title":"Ask backward, not forward","text":"Future-tense questions invite speculation: Would you use this? How much would you pay? Do you think your team needs it? The respondent can construct a plausible answer without confronting any constraint. Past-tense questions force the conversation toward facts: When did this last happen? What did you do? What did that cost? What else did you try? The book demonstrates the difference through its own mother-and-cookbook example. A bad conversation introduces an iPad cookbook idea, confirms that the interviewee likes the iPad and cooking, then treats an encouraging reaction as validation. The questions manufacture agreement because every answer is downstream of the pitch. In Fitzpatrick's improved version, the founder asks how the iPad is actually used and how recipes are currently found and followed. The details reveal behavior the product pitch concealed. General affection for cooking and technology does not automatically produce a recurring need for a new cookbook product. The example matters because it shows that the same person can give an enthusiastic opinion and contradictory behavioral evidence without being dishonest. Past behavior is not destiny. A new regulation, technical capability, or organizational change can make tomorrow unlike yesterday. But when that is your thesis, name the change explicitly and test its consequences. Do not use novelty as permission to return to ungrounded predictions."},{"title":"Compliments hide the absence of commitment","text":"Founders often record positive phrases because praise is emotionally salient and easy to summarize. The book treats compliments as warning signs. They are not negative evidence, but they often tempt the interviewer to stop asking the questions that would produce real evidence. The useful response to praise is neither gratitude nor skepticism. It is a return to specifics. If someone says the problem is important, ask what happened the last time it appeared. If they say they would pay, ask what they already spend to manage it. If they call the product exciting, ask who else would need to approve it and what the next step would be. This turns customer development from sentiment collection into movement. A conversation advances when it produces a fact that changes the model or a commitment that opens the next source of evidence. Ten pleasant calls with no change in behavior may be less informative than one uncomfortable call that exposes a missing buyer, an inaccessible workflow, or a problem too minor to fund."},{"title":"A real problem leaves traces","text":"Many problems are genuine but commercially weak. People tolerate annoyances, complain about them, and agree they should be fixed. The relevant question is whether the problem is important relative to everything else competing for attention. Important problems leave traces. Someone has built a workaround, paid for an imperfect tool, assigned staff, accepted delays, escalated failures, or repeatedly searched for alternatives. The trace need not be money. It can be time, risk, political attention, or an ugly manual process that survives because the outcome matters. An absence of traces is also information. If a supposedly urgent problem has not caused any response, the pain may be infrequent, the affected person may lack authority, or the current workaround may be good enough. The interviewer's job is not to argue the person into caring. It is to discover which explanation fits."},{"title":"Good interviews are designed around a decision","text":"The Mom Test is sometimes reduced to a list of clever questions. That misses the operating discipline underneath them. Before the conversation, decide what uncertainty matters and what evidence would change the plan. Otherwise even a candid interview can become a tour of interesting facts. A useful sequence is short: 1. Name the decision the conversation should inform. 2. Reconstruct specific past behavior around that decision. 3. Ask for the smallest commitment that would produce the next piece of evidence. The learning goal should be written before the call. It may be a question about who owns the problem, whether the pain is frequent, what the current alternative costs, or why an earlier solution was abandoned. A fixed learning goal makes it easier to notice when an entertaining conversation has drifted away from the decision. It also makes interviews comparable without turning them into a rigid questionnaire. Learning and selling can happen in the same relationship, but they should not be confused. Once you explain the product, later reactions are responses to the pitch. They can still help with language, objections, and product comprehension; they are simply a different kind of evidence. Marking that transition in the notes prevents the team from mixing observed behavior with prompted opinion. Afterward, keep the conditions attached to what you learned. Role, workflow, frequency, stakes, and current alternative determine where an observation applies. Combining every interview into an average “customer” erases the differences that make the evidence useful. Notes should preserve what happened before they compress it into a conclusion. “They manually reconcile three exports every Friday” is evidence. “They need automation” is an interpretation. The distinction matters because a different reader may infer a different product, buyer, or constraint from the same fact. Good discovery keeps that correction possible. The method also changes what counts as a successful call. Bad news is not a failed interview. Discovering that the buyer is different, the pain is rare, or access is blocked may save months of building. A failed interview is one that protects the idea from reality."}]},{"id":"the-design-of-everyday-things","title":"The Design of Everyday Things","sections":[{"title":"Introduction","text":"Don Norman’s central argument is that much everyday “user error” is evidence of bad design: the object, interface, procedure, or organization has failed to show people what actions are possible, which action will produce which result, or whether the intended result happened. The point matters because it changes where diagnosis begins. A person who hesitates at a door, tries every stove knob, misreads a thermostat, or struggles with a hotel shower is not necessarily careless or unintelligent. The design may have hidden its logic and then blamed the user for not guessing it. The book’s deeper tension is between technical possibility and human usability. A product can contain useful features and still be poorly designed if people cannot discover, select, perform, and evaluate those features. Norman explains usability as a psychological loop: people form goals, translate them into actions, act on the world, perceive what changed, interpret the change, and decide whether they are done. Design succeeds when the artifact supports that loop. It fails when it makes people depend on memory, trial and error, or the designer’s private assumptions."},{"title":"The artifact is the message the designer leaves behind","text":"Norman treats design as communication. The designer’s understanding of how a thing works cannot reach the user directly. It has to travel through what Norman calls the system image: the object’s visible form, labels, behavior, documentation, and surrounding context. If that image is coherent, users can build a useful conceptual model. If it is incoherent, they memorize isolated steps and become helpless when anything changes. The book’s doors make this visible because the mechanism is simple but the communication can still fail. A door may physically allow pushing or pulling, yet its handle, plate, or label may suggest the wrong action. The person who pulls a door that should be pushed has not failed a reasoning test. The door has made one action available while communicating another, or it has not communicated strongly enough. The same principle scales to devices with more parts. Norman’s hotel shower example, also discussed in his writing on design as communication, shows how context helps create a model. Soap dishes, towels, grab bars, a showerhead, tub, materials, and placement all contribute to the user’s understanding of the situation. The control is not interpreted only as a piece of hardware. It is interpreted inside the familiar activity of taking a shower. A conceptual model does not need to be technically complete. A user does not need professional knowledge of plumbing, electricity, or software architecture. But the model must be good enough to predict what an action will do and to recover when something unexpected happens. Norman’s thermostat example belongs here: when people act from a false model of how the control system works, their actions may feel sensible to them while failing to match the device’s actual behavior."},{"title":"Discoverability is not the same as possibility","text":"A design must make action discoverable before it can be usable. Norman’s vocabulary begins with affordances: possibilities for action created by the relationship between an actor and an object. A chair affords sitting for someone who can sit; a handle affords grasping or pulling for someone able to use it that way. Affordances are relational, not simply physical properties sitting inside the object. For practical design, however, what matters is often the perceived affordance: what the user can tell is possible. Norman later sharpened this point by emphasizing signifiers, the perceivable cues that indicate where and how to act. Labels, arrows, handles, highlighted regions, disabled menu items, and some incidental cues can all signify action. The distinction matters because designers often say “affordance” when they mean “cue.” On a touchscreen, much of the surface physically affords touching, but only some visual marks or behaviors signify that touching there will do something meaningful. This prevents a common misreading of Norman’s argument. Good design is not merely adding labels everywhere, and it is not assuming that a possible action will be obvious because the mechanism permits it. A door can afford pushing while a handle signifies pulling. A digital control can be technically tappable while looking inert. Signifiers can also depend on culture and convention, so what feels intuitive to one group may simply be familiar to that group. The useful design question therefore has two parts. What actions are actually possible for this user in this situation? And how will the user know those actions are possible before acting? Confusing products often fail because those questions have been collapsed. The mechanism works, but the invitation to use it is missing, misleading, or dependent on memory."},{"title":"Mapping turns controls into expectations","text":"Once users can discover possible actions, they still need to know which action produces which result. Norman calls this mapping: the relationship between controls and their effects. Good mapping lets people infer the correct control from spatial, analogical, or culturally familiar relationships. Poor mapping forces memorization. The book’s light switches and stove or oven burners make the mechanism concrete. A row of switches may control different lights, but if the arrangement of switches does not correspond to the arrangement of lights, the user must learn by trial, memory, or labels. Stove controls create the same problem when knobs do not naturally correspond to burners. The difficulty is not operating a switch or knob. It is knowing which control belongs to which outcome. Mapping is different from signification. A knob may visibly invite turning, and a label may name it, but mapping concerns the structure of correspondence: which knob controls which burner, which switch controls which light, which gesture changes which screen object. Strong mapping reduces cognitive work because the world carries the relationship. The user recognizes the connection instead of recalling an arbitrary rule. Norman’s qualification is important: “natural” mapping is not always universal. Some mappings depend on learned convention. The revised edition’s destination-control elevator example shows the disruption caused when a system changes a familiar sequence, even if the new system may have operational advantages. People used to choosing a floor inside the elevator can be disoriented when they must choose a destination before entering. The design challenge is not only technical efficiency. It is helping users revise their model at the moment their old convention stops working. This is why Norman should not be reduced to “make everything simple.” Some complexity is legitimate. The problem is confusion: complexity that cannot be discovered, predicted, or evaluated. A stove, elevator, computer, or phone may need multiple functions. The design task is to organize those functions so that people can act within the complexity without guessing."},{"title":"Constraints and feedback keep the action loop from drifting","text":"Constraints reduce the set of possible actions so correct action becomes easier and error becomes less likely. Norman distinguishes physical, cultural, semantic, and logical constraints. A physical constraint makes some actions impossible. A cultural constraint relies on learned convention. A semantic constraint follows from the meaning of the situation. A logical constraint follows from relationships among parts. The important point is that constraints are not merely restrictions. They move knowledge from the user’s memory into the world. This matters because action is fragile. People are often busy, interrupted, uncertain, or acting from partial understanding. A useful constraint can guide assembly, sequence, or selection by making wrong moves unavailable or unlikely. In the book’s later error discussions, related devices include forcing functions, interlocks, lock-ins, and lock-outs: design features that block dangerous actions, require prerequisites, or prevent premature abandonment. These are valuable when error costs are high, though a constraint can become bad design if it blocks legitimate recovery or ignores how people actually work. Feedback completes the loop. After acting, users need to perceive what happened, interpret the new state, and compare it with their goal. Feedback must be timely, informative, and proportional. A beep, blink, or animation may attract attention without explaining state or outcome. Good feedback connects action to consequence, which lets users learn the system rather than repeat superstition. Norman’s two gulfs name the places where designs fail. The gulf of execution is the gap between a user’s goal and the actions the system makes available or apparent. The gulf of evaluation is the gap between the system’s actual state and the user’s ability to perceive and interpret it. Discoverability, signifiers, mapping, constraints, and conceptual models help bridge execution. Feedback, visible state, interpretable results, and conceptual models help bridge evaluation. A compact diagnostic rule follows from this: when a design fails, do not begin by asking what the user forgot; ask where the action loop broke. 1. Could the user tell what actions were possible? 2. Could the user connect the intended result to the right control? 3. Could the user perform the action without unnecessary precision or memory? 4. Could the user perceive and interpret what changed? 5. Could the user tell whether the goal had been achieved? These questions condense Norman’s seven stages of action, but the stages should not be treated as a literal conscious checklist. People explore, learn, and act fluidly. The model is useful because it locates breakdowns that would otherwise be dismissed as vague confusion."},{"title":"Error should trigger redesign, not just blame","text":"Norman’s treatment of error is one of the book’s most useful shifts. Human error exists, but blame is usually a weak design explanation. The stronger question is what made the error likely, hard to notice, hard to reverse, or easy to repeat. Error is data about conditions. The revised edition’s error chapter makes this explicit by challenging the phrase “human error.” Its examples include a wrong turn on a highway and closing the wrong window, which point toward different responses. Some errors come from mistaken understanding; others are slips in execution; others involve lapses, violations, or organizational conditions. The remedy depends on the error type. A slip may call for better feedback, confirmation, undo, or constraint. A mistake may call for a better conceptual model or clearer mapping. A recurring organizational error may require reporting, root-cause analysis, and more resilient procedures. Norman’s broader examples from the revised edition, including Toyota’s jidoka and poka-yoke, the NASA Aviation Safety Reporting System, and the Swiss cheese model, extend the argument beyond consumer products. Systems should detect, report, block, and recover from error rather than rely on perfect human performance. This does not absolve people of responsibility; it makes responsibility more useful. Blame alone does not explain why an action was available, why a warning was missed, why the state was hidden, or why recovery was difficult. The book’s practical consequence is a change in what counts as evidence. Hesitation, repeated mistakes, workarounds, and surprise are not noise around the design. They are the design speaking back. A good everyday thing does not require the user to be unusually careful, patient, or trained in the designer’s private logic. It makes possible actions discoverable, maps controls to effects, constrains action where mistakes are likely, and gives feedback that makes outcomes understandable. The result is not necessarily a simpler world. It is a world whose complexity can be acted on without humiliation."}]},{"id":"yujun-product-methodology","title":"俞军产品方法论 (Yu Jun's Product Methodology)","sections":[{"title":"Products are exchanges, not feature lists","text":"Yu Jun frames product management around the relationship between users, firms, and products. The publisher’s outline moves from those relationships to transaction models and decision-making. The useful shift is to ask what value changes hands, not simply what the team can ship. A user can like an idea and still have no reason to leave an existing solution."},{"title":"Make the alternative visible","text":"A practical application is to write down the current workaround before evaluating the new experience. What does the user already get? What effort, risk, trust, or learning would switching require? This exercise is an application of the book’s exchange-centered framing, not a formula that guarantees adoption. Different users can face very different tradeoffs even when they see the same interface."},{"title":"Turn the model into a test","text":"Choose one concrete user situation. Describe the existing behavior, the proposed benefit, and the cost of changing. Then observe whether the user actually makes the exchange. Keep the firm’s ability to sustain the service in view as well: a product must create value for the user without making continued provision impossible. Treat the model as something to revise with evidence, not a way to make intuition sound scientific."}]},{"id":"the-crowd","title":"The Crowd","sections":[{"title":"A group can change the conditions of judgment","text":"Le Bon argues that a psychological crowd is not merely many people standing together. He describes a shared orientation in which suggestion, emotional contagion, and anonymity can change individual behavior. His account emphasizes the influence of vivid images, repeated assertions, and the prestige of leaders over sustained argument."},{"title":"Influence is not evidence","text":"The lasting question is how a group comes to experience a claim as obvious. Repetition can make an assertion familiar; familiarity can be mistaken for confirmation. A confident speaker can coordinate attention without supplying new evidence. As a reading exercise, distinguish the content of a claim from the social conditions that make it persuasive."},{"title":"Read the book against its own assumptions","text":"This is an influential nineteenth-century argument, not a reliable description of every crowd. Le Bon’s racial, gender, and class generalizations are prejudiced, and his sweeping claims should not be imported as modern scientific consensus. His framework can also miss cooperation, deliberation, and differences between institutions. Use it to generate questions about influence, then test those questions against observable behavior and contemporary research. Do not use “crowd psychology” as a shortcut for dismissing people who disagree with you."}]},{"id":"capital","title":"Capital (Das Kapital)","sections":[{"title":"Start with the commodity","text":"This guide concerns Volume I, not every volume of Capital. Marx begins with the commodity and distinguishes its usefulness from the social relations expressed through exchange. He asks how a society organized around market exchange makes relations between people appear as relations between things. The argument is an analysis of a particular social system, not just a complaint about individual greed."},{"title":"Labor-power is not the same as completed labor","text":"In chapters six and seven, Marx distinguishes the capacity to work, sold for a wage, from the labor performed during production. His explanation of surplus value depends on that distinction: the value produced during the working day can exceed the value represented by the wage. The analysis therefore turns toward control over production, the length of the working day, and how productivity gains are distributed."},{"title":"Keep explanation and endorsement separate","text":"When reading, trace each term through the argument rather than translating every occurrence of “value” into market price. Ask what Marx is trying to explain, which assumptions carry the explanation, and where another economic account would disagree. His categories remain influential and contested; they should not be presented as uncontested economic laws. Terry’s original catalog marks this book as partially read, and that status is preserved here."}]},{"id":"the-globalization-paradox","title":"The Globalization Paradox","sections":[{"title":"Integration creates political choices","text":"Rodrik challenges the idea that more global economic integration is always the right policy target. His central tension concerns democracy, national self-determination, and extensive economic globalization. Pursuing all three without limits can force a conflict over who gets to choose the rules."},{"title":"Ask who can change the rules","text":"A useful way to apply this framing is to examine one policy disagreement. Which decisions are being standardized internationally? Which domestic choices become harder to reverse? Who benefits from predictability, and who loses the ability to adapt a rule to local preferences? These are analytical questions, not evidence that every international agreement is harmful."},{"title":"Distinguish globalization from its most demanding version","text":"Rodrik’s argument is not a demand to end trade. It questions a model in which domestic institutions are continually reorganized around deeper integration. A more restrained international order can leave room for democratic variation. The practical reading task is to identify the tradeoff a proposal hides: do its promised economic gains require giving up a choice people still expect to make politically? Treat that tradeoff as something to debate openly, not a technical detail that experts have already settled."}]},{"id":"the-great-divergence","title":"The Great Divergence","sections":[{"title":"Compare like with like","text":"Pomeranz asks why sustained industrial growth began in northwestern Europe. His comparison challenges stories that treat all of Europe and all of China as uniform units. The publisher’s account emphasizes similarities between advanced regions and the ecological constraints they faced before industrial divergence."},{"title":"Look for the constraint that changed","text":"The book gives coal and access to resources from the New World a central role in explaining how parts of Europe escaped land-intensive limits. This is a change in the explanation: success cannot be read backward as proof that one region had always possessed every decisive advantage. Contingent access to energy and overseas resources matters alongside developments inside Europe."},{"title":"Do not turn a revision into a monocausal story","text":"The practical lesson for reading historical arguments is methodological. Check the units being compared, the period under discussion, and the proposed causal mechanism. Similarity on one measure does not prove equality on every measure; the importance of coal does not make institutions irrelevant. Pomeranz’s account is an influential intervention in a continuing debate. Ask what evidence would distinguish a resource-constraint explanation from a claim that earlier cultural or institutional differences already made the outcome inevitable."}]},{"id":"taipei-people","title":"台北人","sections":[{"title":"A collection, not one representative life","text":"Pai Hsien-yung’s fourteen stories follow people whose lives in Taiwan remain entangled with memories of mainland China. The collection approaches displacement through distinct voices and social worlds. It does not reduce its characters to a single political argument or one model of nostalgia."},{"title":"Notice what the past does in the present","text":"A useful reading question is not only what a character remembers, but what remembering allows them to do or prevents them from doing now. Social rituals, attachment, and self-presentation can keep an earlier identity alive even when the conditions supporting it have disappeared. This is an interpretive lens for reading, not a clinical diagnosis of the characters."},{"title":"Preserve the differences between stories","text":"Compare how two characters respond to loss rather than extracting one moral from the collection. Who can tell their own story? Who is described by others? Where does sympathy coexist with irony? The value of the book is partly in these unresolved differences. Read slowly enough to notice voice and narrative distance; an overview can orient attention, but it cannot replace the experience of the prose."}]},{"id":"the-peony-pavilion","title":"牡丹亭","sections":[{"title":"Feeling becomes a dramatic force","text":"The Peony Pavilion is Tang Xianzu’s celebrated drama, known in English through translations including Cyril Birch’s. Read it as a work of theater and lyric expression, not a modern argument with a single takeaway. Dreams and desire create a space in which experience can exceed the roles and expectations assigned to a person."},{"title":"Read for tensions, not just events","text":"An interpretive starting point is the tension between inward conviction and outward authority. What makes an experience real to the person having it, and what would count as proof to a family or institution? Following that tension can make scenes more legible without collapsing their poetry into a lesson about individual freedom."},{"title":"Keep the performance in view","text":"The page is only one way to encounter this work. Songs, pacing, gesture, and staging shape its effects. When a passage feels difficult, compare a translation with a responsibly contextualized performance rather than assuming that plot summary captures everything important. This short guide is an orientation, not a substitute for the drama or a scene-by-scene account. The linked scholarly material offers a starting point for identifying the author, translations, and selected passages."}]},{"id":"miyazakiworld","title":"Miyazakiworld","sections":[{"title":"Biography and artistic worlds illuminate each other","text":"Susan Napier examines Hayao Miyazaki’s life and work together. Yale’s overview highlights recurring concerns including women’s agency, environmental anxiety, and utopian imagination. The book provides a way to see relationships across films without assuming that every work communicates the same message."},{"title":"Look for a tension that remains unresolved","text":"A productive viewing exercise is to choose one recurring theme and compare how two films handle it. Does technological wonder coexist with destruction? Does a place offer refuge while depending on hidden labor? These are suggested questions for interpretation, not a claim that every film contains the same symbolism."},{"title":"Resist the comfort of a single label","text":"Calling the films simply environmentalist, nostalgic, or escapist can obscure the tensions that make them compelling. Attend to how an image makes conflicting feelings possible at once. Napier’s critical biography can supply context; a viewer still needs to test an interpretation against the film itself. Use the book to sharpen attention, not to replace watching with an approved explanation."}]},{"id":"disgrace","title":"耻","sections":[{"title":"A fall from status does not guarantee understanding","text":"Coetzee’s novel follows David Lurie, a university professor whose involvement with a student costs him his position. He goes to stay with his daughter Lucy in rural South Africa. Their relationship is placed under further pressure by violence and by the unequal histories around them. The novel includes sexual violence and its aftermath."},{"title":"Separate a character’s account from the novel’s judgment","text":"David’s ability to articulate a view does not make that view adequate. One useful reading discipline is to ask when his language clarifies an event and when it protects him from recognizing another person’s experience. Do not assume that access to his perspective amounts to endorsement by the author."},{"title":"Leave room for moral difficulty","text":"This is not a clean redemption story or a practical manual for resolving political conflict. Its force lies in making responsibility, vulnerability, and authority difficult to separate. Track who can speak, whose choices David struggles to accept, and what changes in action rather than explanation. These questions are interpretive prompts; they should not flatten Lucy into a symbol or make one character stand for an entire society."}]},{"id":"thinking-fast-and-slow","title":"Thinking, Fast and Slow","sections":[{"title":"Introduction","text":"A map of the two systems that run your mind — and the predictable ways the fast one fools you."},{"title":"Core lessons","text":"1. System 1 and System 2. System 1 is fast, automatic, effortless, and always on: it reads faces, completes \"bread and...\", and generates impressions before you ask for them. System 2 is slow, deliberate, and lazy: it does logic, comparison, and self-control, but only when summoned — and it tires. The central drama of the book is that System 2 believes it is the hero while mostly rubber-stamping System 1's suggestions. 2. WYSIATI — What You See Is All There Is. System 1 builds the most coherent story possible from the information at hand and does not flag what's missing. Confidence tracks the coherence of the story, not the quality or completeness of the evidence. This single mechanism underwrites overconfidence, framing effects, and base-rate neglect: a vivid description of a tidy, bookish person swamps the fact that there are vastly more farmers than librarians. 3. Substitution: answering an easier question. Faced with a hard question (\"Should I invest in this company?\"), System 1 quietly substitutes an easier one (\"Do I like this founder?\") and answers that instead — without notifying you of the swap. Most intuitive errors are correct answers to the wrong question. 4. Anchoring, availability, and representativeness. The three classic heuristics. Anchoring: any number on the table — even a random one — pulls your estimate toward it. Availability: ease of recall masquerades as frequency (plane crashes feel common; dishwasher accidents don't). Representativeness: similarity to a stereotype overrides statistics. 5. Loss aversion and prospect theory. Losses loom roughly twice as large as equivalent gains, and outcomes are evaluated relative to a reference point, not in absolute terms. This explains why people reject favorable gambles, hold losing positions too long, and why a \"discount\" and a \"surcharge\" of identical size produce different behavior. 6. The two selves: experiencing vs. remembering. The remembering self scores an experience by its peak and its ending (the peak-end rule) and largely ignores duration. We make decisions to serve the remembering self — choosing the vacation that will make the better story rather than the better week. 7. Regression to the mean wears a disguise. Exceptional performance is partly luck, so it is usually followed by something closer to average — no causal story required. Kahneman's flight-instructor example is canonical: praise after great landings seems to make pilots worse, criticism after bad ones seems to help, and both are illusions of regression."},{"title":"Key frameworks","text":"The inside view vs. the outside view. The inside view plans from the specifics of your case (\"we're smart, we're motivated, eighteen months\"). The outside view asks: what's the base rate for projects in this reference class? Kahneman's own curriculum-committee story — insiders forecast 2 years, the reference class said 7-10 with a 40% failure rate, and the insiders shrugged and kept going — is the book in miniature. Always ask for the base rate first, then adjust. The premortem (borrowed from Gary Klein). Before committing, assume the decision failed spectacularly and have each person write the history of the failure. It legitimizes doubt that group dynamics otherwise suppress. When can you trust intuition? Two conditions, both required: (1) a regular environment with stable cause-and-effect, and (2) prolonged practice with rapid, clear feedback. Chess and firefighting qualify; stock picking and long-range political forecasting do not. Confidence is not a substitute — experts feel equally sure in both kinds of domains. Algorithms over judgment in low-validity environments. Where the environment is noisy, simple formulas (even improper ones with equal weights) routinely beat expert holistic judgment — in hiring, parole, and clinical prediction. The practical move: score a few relevant dimensions independently, then decide."},{"title":"When to reach for this book","text":"- Before any high-stakes forecast or plan (use the outside view and a premortem). - When you're suspiciously confident and the evidence is thin. - When designing anything that involves other people's choices: pricing, defaults, framing. - When evaluating performance that might just be regression to the mean."},{"title":"Memorable ideas and lines","text":"The useful public-facing version is not a quote bank; it is a set of warnings you can actually use. When a story feels coherent, ask what evidence is missing. When a forecast feels obvious, ask for the base rate. When a result looks like proof of skill, ask how much regression to the mean is doing the work. The most portable line of thought is Kahneman's distinction between fluency and truth. Easy stories feel true because System 1 likes speed, coherence, and confidence. The remedy is not to become suspicious of every intuition; it is to know which decisions deserve slower machinery. The book is also a reminder that better judgment is usually procedural. You do not debias yourself by deciding to be less biased. You add premortems, outside-view checks, independent estimates, and decision records so the environment catches errors your mind would rather smooth over. And the quiet thesis of the whole book: it is easier to recognize other people's mistakes than your own — so build procedures (checklists, base rates, premortems) rather than relying on willpower to debias yourself."},{"title":"Bias language does not make the observer unbiased","text":"The practical response to the book is procedural humility. Use base rates before narratives harden, record predictions before outcomes are known, separate dimensions before making a holistic judgment, and invite dissent before commitment. The goal is not to eliminate intuition. It is to know when the environment has earned it and to build a decision process that does not depend on noticing one’s own error in real time."}]},{"id":"the-wisdom-of-crowds","title":"The Wisdom of Crowds","sections":[{"title":"Introduction","text":"Why large groups of ordinary people outguess experts — and the exact conditions under which they stop."},{"title":"Core lessons","text":"1. The crowd is smart only under conditions. Galton's ox-weighing example illustrates how independently collected estimates can combine into a surprisingly accurate answer. It is not a claim that groups are always wise. Surowiecki's book is about the conditions: diversity of opinion, independence of judgment, decentralization of knowledge, and a mechanism for aggregation. Remove any one and the crowd degrades into a mob, a committee, or an echo. 2. Errors cancel only when they're uncorrelated. The statistical engine underneath everything: each person's guess is truth plus error. If errors are independent, they cancel in aggregate and the signal remains. If everyone's errors point the same way — because they read the same news, defer to the same expert, or watch each other guess — averaging amplifies the shared bias instead of canceling it. Independence isn't a nicety; it's the mechanism. 3. Diversity beats individual ability (within reason). A group of diverse, decently-informed people typically outperforms a group of the very best individuals, because the best individuals tend to think alike and share blind spots. Adding a less-expert but differently-thinking member can improve the group; adding another clone of the smartest member usually doesn't. 4. Information cascades: how smart individuals make dumb crowds. If people decide in sequence and can see earlier choices, early movers' opinions drown out later movers' private information. Each rational individual concludes \"all these people can't be wrong\" — and a crowd of rational people marches off a cliff. This is the anatomy of bubbles, pile-on funding rounds, and the empty restaurant next to the full one. 5. Three kinds of problems. Cognition problems (questions with answers: how much does the ox weigh, will this ship on time) — crowds excel here. Coordination problems (how do buyers and sellers find each other, which side of the road to drive on) — solved by conventions, norms, and markets. Cooperation problems (taxes, tipping, pollution) — require trust and institutions that make self-interest compatible with the group. Diagnosing which type you face tells you what machinery you need."},{"title":"Key frameworks","text":"The four conditions checklist. Before trusting any aggregate — a poll, a planning meeting, a prediction market, a feedback dashboard — audit it: 1. Diversity: do participants bring genuinely different information and priors? 2. Independence: did each judgment form before exposure to the others? 3. Decentralization: can people draw on local, specific knowledge? 4. Aggregation: is there a mechanism that actually combines the inputs (a market, a vote, a median), rather than a discussion where the loudest voice wins? Collect first, discuss second. The most portable practice in the book: gather private, written estimates before any group discussion. Discussion is for surfacing reasons, not for forming the number. Beware the talkative and the confident. In deliberating groups, talkativeness and status predict influence far better than accuracy does. Unstructured discussion makes groups more extreme (polarization) and more confident — often while making them less accurate. The Columbia/NASA case. Surowiecki's study of the Columbia shuttle disaster's management meetings shows aggregation failing inside a hierarchy: information existed at the edges, but the meeting structure — status-driven, time-boxed, skeptical of dissent — never let it reach the decision. A crowd was present; no mechanism was."},{"title":"When to reach for this book","text":"- When designing any system that pools opinions: forecasting, voting, feedback, prediction, pricing. - When a team unanimously agrees too quickly — this book explains why that's a warning sign, not a comfort. - When deciding whether to trust \"the market,\" \"the poll,\" or \"what everyone is saying.\" - Pairs naturally with Thinking, Fast and Slow: Kahneman explains individual error; Surowiecki explains when groups cancel it versus compound it."},{"title":"Memorable ideas and lines","text":"The useful idea is that a crowd is not wise because it is large. It becomes wise only when people bring different information, make independent judgments, operate close to the facts, and have a clean way to aggregate what they know. That is why the same group can be brilliant in one design and foolish in another. Change the incentives, let one voice dominate, or force consensus too early, and the crowd stops being a distributed intelligence system. The ox-weighing example is an image of independent estimates brought together by a clear rule. The useful question for a team is which parts of that information structure its own process preserves or breaks."},{"title":"A crowd is only as wise as its information structure","text":"The book’s central test is structural. Before trusting a collective answer, inspect where information came from, whether judgments formed independently, which local knowledge remains available, and how inputs become an output. Counting more voices does not repair correlated evidence or a process that rewards conformity. Wisdom is an achievement of design, not a property of a large group."},{"title":"Aggregation mechanisms embed values as well as information","text":"A market, vote, average, jury, and deliberating committee do not merely combine the same inputs in different ways. Each defines who participates, what influence means, which information is expressible, and what outcome counts. Choosing an aggregation rule is therefore part of the substantive decision, not a neutral technical step. Prices can combine dispersed beliefs and incentives efficiently while excluding needs that lack purchasing power and external costs that never enter the transaction. Voting gives participants formal equality while compressing intensity, information, and minority risk into a rule for counting. An average uses all numeric inputs but can be distorted by extremes; a median is robust to extremes while discarding information about magnitude. The mechanism should match the question. Forecasts may benefit from independent probabilities or estimates. Complex value conflicts require deliberation and legitimate authority, not only prediction accuracy. Safety decisions may need vetoes or thresholds because the cost of one kind of error is asymmetric. Surowiecki’s four conditions remain necessary but not sufficient for a just decision. A crowd can accurately predict an outcome without having the right to impose it, and a legitimate democratic choice can remain factually mistaken. Good design separates epistemic questions—what is likely true—from normative and governance questions—what should be done and who may decide—then chooses a process capable of carrying each."}]},{"id":"the-inevitable","title":"The Inevitable (必然)","sections":[{"title":"Look for a direction, not a product prediction","text":"Kelly organizes technological change around recurring processes such as accessing, sharing, filtering, and remixing. The useful claim is that individual inventions sit inside longer changes in how information and services move. A failed product does not necessarily disprove a larger shift, and a successful launch does not prove its timing was inevitable."},{"title":"Separate capability from adoption","text":"A practical reading exercise is to choose one process and trace the constraints around it. What has become cheaper? What still requires trust, coordination, permission, or behavior change? This is an application of Kelly's framework, not a forecast that a particular company or technology must win."},{"title":"Keep the thesis open to correction","text":"The book is deliberately optimistic. Treat its confident language as a hypothesis to examine, not a deadline to accept. Write down an observable sign that would support your chosen trend and another that would weaken it. The goal is better questions about technological change, not certainty about the future."}]},{"id":"outliers","title":"Outliers","sections":[{"title":"Success has a surrounding system","text":"Gladwell turns attention from the traits of exceptional people toward the opportunities, timing, and cultural settings around them. This changes the question from why one person is talented to how talent gets the conditions needed to develop and become visible."},{"title":"Look behind the selection process","text":"As you read a success story, identify who received access, practice, encouragement, and early recognition. Then ask who faced similar demands without those advantages. This comparative exercise is more useful than borrowing one famous person's routine and assuming it will reproduce the outcome."},{"title":"Do not turn a pattern into a guarantee","text":"A compelling story can suggest a mechanism without proving how widely it applies. The popular practice-hours interpretation should not be treated as a universal threshold for expertise. Use the book to notice hidden opportunities and cumulative advantages, while leaving room for differences between fields, individual choices, and evidence that does not fit the narrative."}]},{"id":"duan-yongping-biography","title":"段永平传","sections":[{"title":"Follow the decisions across changing roles","text":"Sun Like's biography traces Duan Yongping's education, working life, entrepreneurship, and investing. Read those as different settings with different constraints, not as one uninterrupted success formula. What worked for an operating business may depend on conditions that do not transfer to an investment decision."},{"title":"Reconstruct what was knowable then","text":"For a consequential choice in the narrative, separate the information available at the time from the successful outcome visible in hindsight. Ask which alternatives were plausible, what could have gone wrong, and which commitments made a change of direction difficult. This is a reading method, not a claim that the biography answers every question."},{"title":"Borrow questions rather than a persona","text":"Biographies can make a person's choices appear more coherent than they felt while living them. Keep the author’s interpretation separate from documented events and your own application. The useful output is a decision question you can test in your circumstances, not an imitation of a successful investor's identity."}]},{"id":"the-light-of-operations","title":"运营之光：我的互联网运营方法论与自白","sections":[{"title":"Operations connects activities into a system","text":"Huang Youcan treats internet operations as a professional discipline rather than a collection of promotional tricks. The contents connect user participation, content production and distribution, metrics, product stages, and the design of an operating system. A tactic becomes meaningful only in relation to the behavior it is supposed to change."},{"title":"Trace the whole user path","text":"Choose one outcome and map the steps that lead to it. Where do people discover the product, receive value, return, and contribute? Identify the weakest transition before selecting a campaign or channel. This exercise applies the book's process-oriented approach without assuming that every product needs the same operating playbook."},{"title":"Match the method to the product","text":"An early product learning what users value needs different work from a mature community maintaining participation. Read the cases with their stage and business model attached. Measure whether an intervention improves the intended experience, not merely whether it generates a visible burst of activity."}]},{"id":"true-demand","title":"真需求 (True Demand)","sections":[{"title":"An idea is not yet a business","text":"Liang Ning organizes the book around value, consensus, and model. The framework asks readers to examine more than whether a product sounds useful: an offering also needs shared recognition of its value and a structure that allows the business to work."},{"title":"Locate the missing connection","text":"A practical application is to describe a proposed offering in three separate paragraphs. What changes for the customer? Why would the relevant people recognize and accept that change? How can the organization provide it sustainably? A persuasive answer to one question does not automatically answer the other two."},{"title":"Test the framework against behavior","text":"Use the industry stories as cases to compare, not a promise that a three-part model guarantees success. Look for evidence of actual adoption, payment, repeated use, or commitment. When the story and observed behavior disagree, investigate the mismatch instead of relabeling the idea as a hidden demand that customers simply do not understand."}]},{"id":"how-to-win-friends","title":"How to Win Friends and Influence People","sections":[{"title":"Influence begins with the relationship","text":"Carnegie approaches communication and leadership through the way people experience an interaction. The useful shift is from preparing an argument that displays your intelligence to understanding what the other person is trying to accomplish and what makes cooperation possible."},{"title":"Make understanding observable","text":"Before making a request, try describing the other person's concern in terms they would recognize. Invite correction and listen to the answer. This is a practical reading exercise: it makes perspective-taking something you can check, rather than a flattering belief that you already understand everyone."},{"title":"Sincerity sets the boundary","text":"Social techniques become manipulative when interest is performed only to secure compliance. Read the advice alongside honesty, consent, and legitimate disagreement. Getting along does not require avoiding every hard conversation or accepting mistreatment. The strongest application is a clearer, more respectful exchange in which the other person remains free to say no."}]},{"id":"poor-charlies-almanack","title":"Poor Charlie's Almanack","sections":[{"title":"One discipline is not enough","text":"This collection of Munger's talks draws across business, psychology, history, science, and ethics. Its organizing idea is to assemble multiple mental models rather than force every decision through the method you know best. Different explanations can reveal different failure modes in the same situation."},{"title":"Use models to challenge a decision","text":"For a live choice, describe the incentives, the base rates, and the ways your preferred outcome could fail. Ask whether each model changes a prediction or exposes a hidden assumption. This exercise is an application of the multidisciplinary approach; merely naming more concepts does not make the analysis stronger."},{"title":"Keep competence and outcome separate","text":"A successful person's account is useful evidence, but not proof that every habit caused the success. Distinguish a durable reasoning method from a particular historical investment. Keep uncertainty visible and seek disconfirming information. The book belongs in a decision-making toolkit, not in place of independent research or an assessment of your own financial constraints."}]},{"id":"mans-search-for-meaning","title":"Man's Search for Meaning","sections":[{"title":"Keep the testimony in view","text":"Frankl combines an account of imprisonment in Nazi concentration camps with an introduction to logotherapy, his meaning-centered approach. The historical experience is not a decorative example for a productivity lesson. Read the testimony on its own terms before extracting an application."},{"title":"Meaning is more than feeling good","text":"The publisher's guide foregrounds love, responsibility, hope, and inner freedom. One way to read is to distinguish what a person can choose from the circumstances they cannot control. That distinction invites reflection about responsibility without pretending that suffering is chosen or that external conditions do not matter."},{"title":"Avoid making endurance a moral test","text":"Do not turn the book into a claim that people who suffered or died lacked purpose. Nor does a reading guide replace mental-health care. A modest personal application is to identify a relationship, task, or responsibility that matters to you, while allowing grief, uncertainty, and the need for support to remain real."}]},{"id":"capitalism-socialism-democracy","title":"Capitalism, Socialism and Democracy","sections":[{"title":"Economic systems change their own setting","text":"Schumpeter examines capitalism, socialism, and democracy as evolving social arrangements. A central provocation is that capitalism's own development may alter the institutions and attitudes that support it. The argument is more complicated than either an endorsement of markets or a simple prediction of their collapse."},{"title":"Separate description from preference","text":"While reading, distinguish what Schumpeter thinks could happen from what he considers desirable. A prediction about institutional change is not necessarily a recommendation. Track how the economic argument connects to the analysis of political leadership and democratic competition rather than reading each part in isolation."},{"title":"Treat the forecast historically","text":"The book's large claims belong to its period and should be tested against subsequent events, not repeated as settled laws. For a contemporary application, choose one institution and ask how successful economic change might weaken or reshape it. Use that question to guide further research, not to assume that one political outcome is inevitable."}]},{"id":"the-score-takes-care-of-itself","title":"The Score Takes Care of Itself","sections":[{"title":"Leadership shows up in preparation","text":"Walsh's account uses the transformation of the San Francisco 49ers to examine leadership and organizational performance. The useful tension is between wanting a result and building the everyday practices that make the result more likely. Motivation alone does not specify how people should work together."},{"title":"Turn a standard into observable behavior","text":"Pick one recurring team activity. Describe what good preparation, execution, and follow-through look like in concrete terms. Can a new team member recognize the standard without guessing what the leader wants? This exercise applies a process-focused reading of the book rather than copying football routines into unrelated work."},{"title":"Do not confuse process with certainty","text":"Careful preparation improves what a team controls; it does not eliminate competitors, chance, or changing conditions. Review outcomes for feedback while avoiding the temptation to judge every decision solely by its immediate result. A useful standard should support learning and good treatment of people, not become an excuse for rigid control."}]},{"id":"steve-jobs","title":"Steve Jobs","sections":[{"title":"Read a life, not a management template","text":"Isaacson's biography follows Jobs through product creation, company building, and personal relationships. It offers a setting for examining the connection between an individual's taste and the organizations needed to turn that taste into products. Keep the consequences for collaborators in the picture."},{"title":"Distinguish conviction from its costs","text":"Choose a decision in the narrative and separate the intended product benefit from the interpersonal or organizational cost of pursuing it. Ask whether that cost was necessary, merely tolerated, or obscured by success. This is a critical reading method, not a claim that intensity itself explains innovation."},{"title":"Look beyond the central character","text":"A biography naturally concentrates attention on its subject. Reconstruct the contributions of teams, partners, technical foundations, and timing before concluding that an outcome came from one personality. The most useful application is to clarify a standard of product quality you can communicate and test, without treating another person's harmful behavior as a requirement for excellence."}]},{"id":"to-sell-is-human","title":"To Sell Is Human","sections":[{"title":"Moving others is ordinary work","text":"Pink broadens selling beyond a sales job to the everyday effort of persuading people to devote attention, effort, or resources. He argues that better-informed buyers change the relationship: influence cannot rely as easily on one side possessing all the relevant information."},{"title":"Start with perspective and clarity","text":"The book's central qualities are attunement, buoyancy, and clarity: understanding another perspective, handling rejection, and helping people see a problem more clearly. Before polishing a pitch, ask whether you have identified the right problem and understood the person's context."},{"title":"Make service the test","text":"A practical exercise is to rewrite a request around the benefit to the person receiving it, then make the next action specific and optional. If the only benefit belongs to you, improve the offer rather than the pressure. Read the persuasion techniques through this ethical boundary: influence should leave people better informed and able to choose, not merely more likely to comply."}]},{"id":"on-task","title":"On Task","sections":[{"title":"Knowing a goal is not executing it","text":"Badre introduces cognitive control: how the brain organizes behavior to achieve goals. The distinction matters because having the relevant knowledge does not by itself explain how a person selects the right action at the right moment. Context, rules, and competing demands shape that translation."},{"title":"Notice the structure of a task","text":"For one difficult activity, distinguish the overall goal from the immediate action and the cues that connect them. Where do you have to remember a rule, switch between contexts, or decide which information matters? This is a practical observation exercise, not a neurological diagnosis."},{"title":"Avoid the single-switch explanation","text":"A neuroscience account is not a promise that one productivity trick will unlock the brain. Read explanations at their intended level and distinguish laboratory findings from broad workplace advice. A modest application is to make task rules and next actions easier to retrieve, then observe whether the change helps in the situation you actually face."}]},{"id":"the-technological-republic","title":"The Technological Republic","sections":[{"title":"Technology development is a political choice","text":"Karp and Zamiska argue for a closer relationship between the technology industry, national purpose, and defense. Read this as a normative argument about what technological capability should serve, not a neutral account of where innovation naturally goes."},{"title":"Ask who defines the mission","text":"For each proposed public purpose, identify who chooses it, who gains power, and who is accountable for failure or misuse. A shared mission can mobilize resources while still leaving serious disagreements about rights, priorities, and the use of force. The existence of technical capacity does not settle those disagreements."},{"title":"Keep the authors' position visible","text":"The authors write from within the technology and national-security world they discuss. That perspective provides experience and also warrants scrutiny. Compare their diagnosis with alternative views of public-interest technology, democratic oversight, and civilian needs. The useful reading outcome is a clearer account of the institutional choices involved, not automatic agreement with the proposed program."}]},{"id":"zen-motorcycle-maintenance","title":"Zen and the Art of Motorcycle Maintenance","sections":[{"title":"Attention is part of the inquiry","text":"Pirsig combines a motorcycle journey with philosophical reflection about quality and ways of understanding experience. Do not expect either a straightforward repair manual or a systematic introduction to Zen. The movement between story and argument is part of how the book asks its questions."},{"title":"Hold different ways of seeing together","text":"One reading lens is the tension between analytical understanding and immediate experience. When a machine fails, technical knowledge matters; so do patience, care, and the attitude brought to the work. This interpretation does not make either perspective sufficient on its own."},{"title":"Do not reduce the journey to a slogan","text":"Follow how the narrator's relationships and history complicate the philosophical claims. When a passage seems to define quality, ask what the surrounding scene adds or resists. A practical application is to examine one task you normally rush through and notice what changes when understanding and care are treated as part of doing it well."}]},{"id":"a-culture-of-growth","title":"A Culture of Growth","sections":[{"title":"Growth depends on how knowledge is treated","text":"Mokyr argues that cultural changes in early modern Europe helped create conditions for sustained scientific and technological progress. The focus is not simply on having clever people, but on an environment in which new knowledge could be proposed, contested, and used."},{"title":"Trace a mechanism rather than a mood","text":"When the narrative invokes culture, ask what people actually did differently. Who could challenge an accepted claim? How did ideas circulate? What made useful knowledge worth pursuing? These questions help keep the explanation connected to institutions and behavior rather than a vague label of national character."},{"title":"Compare without assuming inevitability","text":"The argument concerns a particular historical development, not a timeless ranking of societies. Read it alongside explanations emphasizing resources, politics, and economic incentives. For an organization today, the relevant question is modest: what practices make criticism, experimentation, and exchange possible? That application is an analogy to test, not proof that a workplace can reproduce an intellectual revolution."}]},{"id":"value-zhang-lei","title":"价值 (Value)","sections":[{"title":"Long-term thinking needs substantive research","text":"Zhang Lei connects his investing experience with an approach centered on long horizons, research, and the creation of value. Read the personal history separately from the general claims about how businesses develop. A successful investment record is context, not a guarantee that every stated principle transfers."},{"title":"Define what would become more valuable","text":"A useful reading exercise is to name the capabilities, customer benefits, or organizational improvements behind a long-term thesis. Merely holding something for longer does not explain why it should improve. Ask which evidence would show that the underlying business is strengthening and which evidence would contradict the story."},{"title":"Patience is not immunity to error","text":"A long horizon can support disciplined work, but it can also become a way to postpone admitting a mistake. Keep a thesis revisable and distinguish conviction from sunk-cost attachment. Treat the book as a perspective on business and investing, not personalized financial advice or a reason to imitate a portfolio without independent research."}]},{"id":"the-beginning-of-infinity","title":"The Beginning of Infinity","sections":[{"title":"Progress begins with explanations","text":"Deutsch places explanatory knowledge at the center of human progress. The opening excerpt asks why humans can understand and influence a universe vastly larger than themselves. The important shift is from cataloging what happens to developing explanations that reveal what else may be possible."},{"title":"Ask what the explanation rules out","text":"A practical reading exercise is to compare two accounts of the same event. Can either be adjusted to fit almost any outcome? Which parts carry the explanation, and what criticism would force a real revision? This applies the book's interest in explanation without claiming that a neat story is sufficient evidence."},{"title":"Optimism still requires error correction","text":"Read the expansive argument as a commitment to solving problems through knowledge, not a prediction that improvement happens automatically. Specific claims still need criticism, evidence, and workable institutions. The useful next step is to identify one obstacle whose mechanism you do not yet understand, then seek an explanation you can challenge and improve."}]}]}</script> <script type="module" src="/reading-app/_astro/speed-read.astro_astro_type_script_index_0_lang.BlShMRCR.js"></script>   </main>  <script type="module" src="/reading-app/_astro/Base.astro_astro_type_script_index_0_lang.DzWQWSMy.js"></script> </body> </html>
