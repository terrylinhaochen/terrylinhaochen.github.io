<div id="project-links-toggle" class="project-links-toggle">
  <button id="project-links-collapsed" class="project-links-collapsed" type="button" aria-expanded="false" aria-controls="project-links-expanded">
    <span>Explore More Content</span>
    <span class="project-links-icon" aria-hidden="true">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="m18 15-6-6-6 6"/>
      </svg>
    </span>
  </button>

  <div id="project-links-expanded" class="project-links-expanded hidden">
    <div class="project-links-header">
      <h4>Explore more</h4>
      <button id="project-links-close" class="project-links-close" type="button" title="Minimize" aria-label="Minimize project links">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M6 9l6 6 6-6"/>
        </svg>
      </button>
    </div>

    <div class="project-link-options">
      <a href="https://crowdlisten.com" target="_blank" rel="noopener" class="project-link-item">
        <span class="project-link-icon">CL</span>
        <span class="project-link-text">Insights with Crowdlisten</span>
        <span class="project-link-arrow" aria-hidden="true">›</span>
      </a>

      <a href="https://chinatravelmadeeasy.com" target="_blank" rel="noopener" class="project-link-item">
        <span class="project-link-icon">CN</span>
        <span class="project-link-text">Travel Guide on China</span>
        <span class="project-link-arrow" aria-hidden="true">›</span>
      </a>

      <a href="https://answerwithbooks.com" target="_blank" rel="noopener" class="project-link-item">
        <span class="project-link-icon">BK</span>
        <span class="project-link-text">Top of minds answered</span>
        <span class="project-link-arrow" aria-hidden="true">›</span>
      </a>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const collapsed = document.getElementById('project-links-collapsed');
  const expanded = document.getElementById('project-links-expanded');
  const close = document.getElementById('project-links-close');

  if (!collapsed || !expanded || !close) return;

  const openLinks = () => {
    collapsed.classList.add('hidden');
    collapsed.setAttribute('aria-expanded', 'true');
    expanded.classList.remove('hidden');
  };

  const closeLinks = () => {
    expanded.classList.add('project-links-collapsing');
    setTimeout(() => {
      expanded.classList.add('hidden');
      expanded.classList.remove('project-links-collapsing');
      collapsed.classList.remove('hidden');
      collapsed.setAttribute('aria-expanded', 'false');
    }, 180);
  };

  collapsed.addEventListener('click', openLinks);
  close.addEventListener('click', closeLinks);
});
</script>
