<div id="project-links-system">
  <div id="user-reminder" class="returning-reminder hidden">
    <div id="reminder-collapsed" class="reminder-collapsed clickable">
      <span class="reminder-text">Explore More Content</span>
      <div class="expand-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="m18 15-6-6-6 6"/>
        </svg>
      </div>
    </div>

    <div id="reminder-expanded" class="reminder-expanded hidden">
      <div class="expanded-header">
        <h4>Explore more</h4>
        <button id="reminder-close" class="reminder-close" title="Minimize" type="button" aria-label="Minimize project links">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 9l6 6 6-6"/>
          </svg>
        </button>
      </div>

      <div class="action-options">
        <a href="https://crowdlisten.com" target="_blank" rel="noopener" class="action-item">
          <div class="action-icon">👥</div>
          <span class="action-text">Insights with Crowdlisten</span>
          <div class="action-arrow">›</div>
        </a>

        <a href="https://chinatravelmadeeasy.com" target="_blank" rel="noopener" class="action-item">
          <div class="action-icon">🧭</div>
          <span class="action-text">Travel Guide on China</span>
          <div class="action-arrow">›</div>
        </a>

        <a href="https://answerwithbooks.com" target="_blank" rel="noopener" class="action-item">

          <span class="action-text">Top of minds answered</span>
          <div class="action-arrow">›</div>
        </a>
      </div>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const reminder = document.getElementById('user-reminder');
  const collapsed = document.getElementById('reminder-collapsed');
  const expanded = document.getElementById('reminder-expanded');
  const close = document.getElementById('reminder-close');

  if (!reminder || !collapsed || !expanded || !close) return;

  reminder.classList.remove('hidden');

  collapsed.addEventListener('click', () => {
    collapsed.classList.add('hidden');
    expanded.classList.remove('hidden');
  });

  close.addEventListener('click', () => {
    expanded.style.animation = 'collapseVertical 0.2s ease-in forwards';

    setTimeout(() => {
      expanded.classList.add('hidden');
      expanded.style.animation = '';
      collapsed.classList.remove('hidden');
    }, 200);
  });
});
</script>
