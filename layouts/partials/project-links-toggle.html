<div id="project-links-system">
  <div id="subscription-modal" class="subscription-modal is-hidden" aria-hidden="true">
    <div class="modal-overlay"></div>
    <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="subscription-title">
      <button id="modal-close" class="modal-close" title="Close" type="button" aria-label="Close subscription form">×</button>
      <div class="modal-body">
        <h2 id="subscription-title">Stay close to the frontier</h2>
        <p>Get updates when I publish new insights about design, technology, and human interaction patterns.</p>
        <form id="subscription-form" class="centered-subscribe-form">
          <input type="email" id="subscription-email" placeholder="your@email.com" autocomplete="email" required>
          <button type="submit" class="submit-btn">Subscribe</button>
        </form>
        <div id="subscription-message" class="form-message" aria-live="polite"></div>
        <div class="modal-footer">
          <button id="modal-no-thanks" class="no-thanks-btn" type="button">No thanks</button>
        </div>
      </div>
    </div>
  </div>

  <div id="user-reminder" class="returning-reminder is-hidden">
    <div id="reminder-collapsed" class="reminder-collapsed clickable">
      <span class="reminder-text">Explore More Content</span>
      <div class="expand-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="m18 15-6-6-6 6"/>
        </svg>
      </div>
    </div>

    <div id="reminder-expanded" class="reminder-expanded is-hidden">
      <div class="expanded-header">
        <h4>Explore more</h4>
        <button id="reminder-close" class="reminder-close" title="Minimize" type="button" aria-label="Minimize project links">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 9l6 6 6-6"/>
          </svg>
        </button>
      </div>

      <div class="action-options">
        <a href="https://crowdlisten.com" target="_blank" rel="noopener" class="action-item">
          <div class="action-icon">👥</div>
          <span class="action-text">Insights with CrowdListen</span>
          <div class="action-arrow">›</div>
        </a>

        <a href="https://chinatravelmadeeasy.com" target="_blank" rel="noopener" class="action-item">
          <div class="action-icon">🧭</div>
          <span class="action-text">Travel guide on China</span>
          <div class="action-arrow">›</div>
        </a>

        <a href="https://answerwithbooks.com" target="_blank" rel="noopener" class="action-item">
          <div class="action-icon">📖</div>
          <span class="action-text">Top of minds answered</span>
          <div class="action-arrow">›</div>
        </a>

        <button id="subscribe-trigger" class="action-item subscribe-item" type="button">
          <div class="action-icon">✉️</div>
          <span class="action-text">Subscribe for updates</span>
          <div class="action-arrow">›</div>
        </button>
      </div>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const reminder = document.getElementById('user-reminder');
  const collapsed = document.getElementById('reminder-collapsed');
  const expanded = document.getElementById('reminder-expanded');
  const close = document.getElementById('reminder-close');
  const subscribeTrigger = document.getElementById('subscribe-trigger');
  const modal = document.getElementById('subscription-modal');
  const modalOverlay = modal?.querySelector('.modal-overlay');
  const modalClose = document.getElementById('modal-close');
  const modalNoThanks = document.getElementById('modal-no-thanks');
  const subscriptionForm = document.getElementById('subscription-form');
  const subscriptionEmail = document.getElementById('subscription-email');
  const subscriptionMessage = document.getElementById('subscription-message');

  if (!reminder || !collapsed || !expanded || !close) return;

  reminder.classList.remove('is-hidden');

  collapsed.addEventListener('click', () => {
    collapsed.classList.add('is-hidden');
    expanded.classList.remove('is-hidden');
  });

  close.addEventListener('click', () => {
    expanded.style.animation = 'collapseVertical 0.2s ease-in forwards';

    setTimeout(() => {
      expanded.classList.add('is-hidden');
      expanded.style.animation = '';
      collapsed.classList.remove('is-hidden');
    }, 200);
  });

  const showModal = () => {
    if (!modal || !subscriptionEmail) return;
    modal.classList.remove('is-hidden');
    modal.setAttribute('aria-hidden', 'false');
    subscriptionEmail.focus();
  };

  const hideModal = () => {
    if (!modal) return;
    modal.classList.add('is-hidden');
    modal.setAttribute('aria-hidden', 'true');
  };

  subscribeTrigger?.addEventListener('click', showModal);
  modalClose?.addEventListener('click', hideModal);
  modalOverlay?.addEventListener('click', hideModal);
  modalNoThanks?.addEventListener('click', hideModal);

  subscriptionForm?.addEventListener('submit', async (event) => {
    event.preventDefault();
    const submit = subscriptionForm.querySelector('button[type="submit"]');
    if (!subscriptionEmail || !subscriptionMessage || !submit) return;

    submit.disabled = true;
    submit.textContent = 'Subscribing...';
    subscriptionMessage.textContent = '';
    subscriptionMessage.classList.remove('success', 'error');

    try {
      await fetch('https://script.google.com/macros/s/AKfycbxF7czbmo2JEeATzFoMnHIfGASoSTzogbjJcuQm30sjBXFqmDOqISWkIHBr64GdmURS/exec', {
        method: 'POST',
        mode: 'no-cors',
        headers: {
          'Content-Type': 'application/x-www-form-urlencoded',
        },
        body: new URLSearchParams({
          email: subscriptionEmail.value,
          pageUrl: window.location.href,
          source: 'explore-more-panel',
        }),
      });

      subscriptionMessage.textContent = 'Thanks for subscribing!';
      subscriptionMessage.classList.add('success');
      subscriptionEmail.value = '';
      setTimeout(hideModal, 1600);
    } catch (error) {
      subscriptionMessage.textContent = 'Something went wrong. Please try again.';
      subscriptionMessage.classList.add('error');
    } finally {
      submit.disabled = false;
      submit.textContent = 'Subscribe';
    }
  });
});
</script>
